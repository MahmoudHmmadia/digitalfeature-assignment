apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedbackhub-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: feedbackhub-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feedbackhub-client
    spec:
      containers:
        - name: client
          image: feedbackhub-client:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: API_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: feedbackhub-config
                  key: API_UPSTREAM
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: feedbackhub-client
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: feedbackhub-client
  ports:
    - name: http
      port: 80
      targetPort: http
