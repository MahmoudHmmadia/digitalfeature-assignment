# Example only. Create a real Secret named feedbackhub-secrets before applying
# the kustomization, and do not commit production credentials.
apiVersion: v1
kind: Secret
metadata:
  name: feedbackhub-secrets
  namespace: feedbackhub
type: Opaque
stringData:
  DATABASE_URL: mongodb://mongodb-0.mongodb:27017/feedbackhub?replicaSet=rs0
  SECRET: replace-with-a-long-random-secret
  EMAIL: ""
  PASSWORD: ""
  EMAIL_FORM: ""
